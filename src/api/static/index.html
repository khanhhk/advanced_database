<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movie Knowledge Graph</title><link rel="stylesheet" href="/static/style.css?v=1.5"></head>
<body><main>
  <header><p>ADVANCED DATABASE</p><h1>Movie Knowledge Graph</h1></header>

  <nav class="tabs" aria-label="Chức năng">
    <button class="tab active" data-panel="chatPanel">Hỏi đáp</button>
    <button class="tab" data-panel="recommendPanel">Gợi ý phim tương tự</button>
  </nav>

  <section id="chatPanel" class="panel active">
    <div class="section-heading"><div><span class="eyebrow">KNOWLEDGE GRAPH QA</span></div><button id="clearChat" class="secondary" type="button">Xóa hội thoại</button></div>
    <div id="chatHistory" class="chat-history" aria-live="polite"><div class="message assistant">Xin chào! Hãy hỏi tôi về phim, diễn viên, đạo diễn, thể loại hoặc mối liên hệ giữa họ.</div></div>
    <form id="askForm" class="composer"><input id="questionInput" placeholder="Nhập câu hỏi tiếp theo…" autocomplete="off" required><button type="submit">Gửi</button></form>
  </section>

  <section id="recommendPanel" class="panel" hidden>
    <span class="eyebrow">IDF-WEIGHTED GRAPH SIMILARITY</span>
    <form id="recommendForm" class="stack-form">
      <div class="form-grid"><label class="movie-picker">Tên phim<input id="movieNameInput" type="search" placeholder="Nhập tên phim…" autocomplete="off" aria-autocomplete="list" aria-controls="movieSuggestions" required><input id="movieIdInput" type="hidden"><div id="movieSuggestions" class="suggestions" role="listbox" hidden></div></label><label>Số kết quả<input id="topKInput" type="number" value="5" min="1" max="20" required></label></div>
      <button type="submit">Tạo danh sách gợi ý</button>
    </form>
    <div id="recommendStatus" class="status" aria-live="polite"></div><div id="recommendResults" class="results-grid"></div>
  </section>

</main><script src="/static/app.js?v=1.8"></script></body></html>
