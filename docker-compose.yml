services:
  neo4j:
    image: neo4j:5.26-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/change-me
    volumes:
      - neo4j_data:/data
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      KG_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me}
    depends_on: [neo4j]
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
volumes:
  neo4j_data:
