services:
  neo4j:
    image: neo4j:5.26-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/change-me
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p change-me 'RETURN 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      KG_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me}
    depends_on: [neo4j]
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
  neo4j-test:
    image: neo4j:5.26-community
    profiles: [test]
    ports: ["7475:7474", "7688:7687"]
    environment:
      NEO4J_AUTH: neo4j/test-password
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p test-password 'RETURN 1' >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
volumes:
  neo4j_data:
