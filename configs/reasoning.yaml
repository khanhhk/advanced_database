profile: rdfs-owl-rl-subset
ontology: ontology/movie_ontology.ttl
input: data/processed/movies.ttl
output: data/processed/movies.inferred.ttl
report: experiments/results/semantic_reasoning.json
rules:
  - rdfs_domain
  - rdfs_range
  - owl_inverse_of
  - owl_symmetric_property
validation:
  - functional_property
  - disjoint_classes
  - required_movie_title
