[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "movie-knowledge-graph"
version = "1.1.0"
description = "Explainable movie knowledge graph, QA and recommendation API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<0.116",
  "httpx>=0.27,<1",
  "neo4j>=5.18,<6",
  "pydantic-settings>=2.2,<3",
  "PyYAML>=6,<7",
  "rdflib>=7,<8",
  "rapidfuzz>=3.6,<4",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["neo4j: requires a running Neo4j instance"]
