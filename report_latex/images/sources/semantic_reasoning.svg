<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#40536b"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #1f2937; text-anchor: middle; }
      .title { font-size: 22px; font-weight: 700; }
      .box-title { font-size: 17px; font-weight: 700; }
      .box-text { font-size: 15px; }
      .note { font-size: 14px; }
      .edge { stroke: #40536b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="420" fill="white"/>
  <text class="title" x="600" y="38">Materialization và kiểm tra ngữ nghĩa</text>

  <rect x="30" y="135" width="180" height="110" rx="12" fill="#e8f1fb" stroke="#3b73a8" stroke-width="2"/>
  <text class="box-title" x="120" y="178">RDF đầu vào</text>
  <text class="box-text" x="120" y="208">342.683 triples</text>

  <rect x="255" y="135" width="225" height="110" rx="12" fill="#f0e8f7" stroke="#7b5aa6" stroke-width="2"/>
  <text class="box-title" x="367.5" y="170">Tập luật</text>
  <text class="box-text" x="367.5" y="198">domain · range</text>
  <text class="box-text" x="367.5" y="222">inverse · symmetric</text>

  <rect x="525" y="135" width="195" height="110" rx="12" fill="#e5f3e5" stroke="#4d8b52" stroke-width="2"/>
  <text class="box-title" x="622.5" y="178">RDF kết quả</text>
  <text class="box-text" x="622.5" y="208">429.192 triples</text>

  <rect x="765" y="135" width="210" height="110" rx="12" fill="#fff3d6" stroke="#c58a18" stroke-width="2"/>
  <text class="box-title" x="870" y="170">Kiểm tra</text>
  <text class="box-text" x="870" y="198">functional · disjoint</text>
  <text class="box-text" x="870" y="222">required title</text>

  <rect x="1020" y="135" width="150" height="110" rx="12" fill="#fde8e7" stroke="#c85452" stroke-width="2"/>
  <text class="box-title" x="1095" y="168">Kết quả</text>
  <text class="box-text" x="1095" y="197">0 vi phạm</text>
  <text class="box-text" x="1095" y="222">+86.509 triples</text>

  <line class="edge" x1="210" y1="190" x2="245" y2="190"/>
  <line class="edge" x1="480" y1="190" x2="515" y2="190"/>
  <line class="edge" x1="720" y1="190" x2="755" y2="190"/>
  <line class="edge" x1="975" y1="190" x2="1010" y2="190"/>

  <text class="note" x="600" y="310">
    Workflow dùng RDFLib và một tập con RDFS/OWL-RL; không phải full OWL 2 DL reasoner.
  </text>
</svg>
